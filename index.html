<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TB-SmartRx — Companion App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tint:#15724A; --deep:#0E4A30; --grp:#F2F2F7; --w:#fff;
  --lab:#000; --sec:#6C6C70; --ter:#A1A1A6; --sep:#E5E5EA;
  --red:#FF3B30; --redD:#A62015; --org:#FF9500; --grn:#34C759;
  --tintS:#E6F1EB; --redS:#FFEBEA; --ambS:#FFF4E0; --amb:#8A5E07;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",Inter,system-ui,sans-serif;
  background:#15201C;
  display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:hidden;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.phone{
  position:relative;width:393px;height:852px;border-radius:54px;
  background:#000;padding:11px;box-shadow:0 28px 70px rgba(0,0,0,.55),0 0 0 2px #2b3330;
  flex:none;
}
.viewport{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--grp)}
.screen{
  position:absolute;inset:0;background:var(--grp);
  display:flex;flex-direction:column;
  transform:translateX(100%);visibility:hidden;
  transition:transform .36s cubic-bezier(.32,.72,0,1),opacity .22s linear,visibility .36s;
  z-index:1;opacity:1;
  will-change:transform;
}
.screen.active{transform:translateX(0);visibility:visible;opacity:1;z-index:3}
.screen.behind{transform:translateX(-26%);visibility:visible;opacity:1;z-index:2}
.screen.ahead{transform:translateX(100%);visibility:visible;opacity:1;z-index:4}
.screen.fadein,.screen.fadeout{transform:translateX(0);visibility:visible;opacity:0;z-index:2}
.screen.dark{background:#0C1512}
.screen.nofx{transition:none}

/* chrome */
.statusbar{position:relative;height:54px;flex:none}
.sb-time{position:absolute;left:28px;top:16px;font-size:15px;font-weight:600;letter-spacing:-.2px}
.island{position:absolute;left:134px;top:11px;width:125px;height:36px;border-radius:18px;background:#000}
.sb-ic{position:absolute;right:26px;top:21px;display:flex;gap:5px;align-items:flex-end}
.dark .sb-time{color:#fff}
.homeind{height:34px;flex:none;display:flex;align-items:center;justify-content:center}
.homeind i{display:block;width:139px;height:5px;border-radius:3px;background:#000;opacity:.85}
.dark .homeind i{background:#fff;opacity:.65}

.nav{flex:none;background:var(--w);display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--sep);gap:4px}
.nav-l,.nav-r{width:86px;font-size:16px;color:var(--tint);display:flex;align-items:center;gap:3px;cursor:pointer}
.nav-r{justify-content:flex-end;text-align:right}
.nav-t{flex:1;text-align:center;font-size:17px;font-weight:600;white-space:nowrap}
.nav-l,.nav-r{width:76px}

.body{flex:1;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:0}
.h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:6px 0 14px}
.sect{font-size:12px;font-weight:600;color:var(--sec);letter-spacing:.3px;text-transform:uppercase;margin:18px 0 7px 4px}
.card{background:var(--w);border-radius:12px;overflow:hidden;margin-bottom:2px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;transition:background .12s}
.row:active{background:#ECECEF}
.sep{height:1px;background:var(--sep);margin-left:16px}
.grow{flex:1;min-width:0}
.rl{font-size:17px}
.rv{font-size:17px;color:var(--sec)}
.sub{font-size:13px;color:var(--sec);margin-top:2px}
.chev{flex:none;opacity:.5}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:9px;white-space:nowrap}
.p-red{background:var(--redS);color:var(--red)}
.p-grn{background:var(--tintS);color:var(--tint)}
.p-amb{background:var(--ambS);color:var(--org)}
.p-gry{background:var(--grp);color:var(--sec)}
.btn{
  display:block;width:100%;border:0;font:inherit;font-size:17px;font-weight:600;
  background:var(--tint);color:#fff;border-radius:14px;padding:15px;margin-top:14px;cursor:pointer;
  transition:transform .1s,filter .1s;
}
.btn:active{transform:scale(.975);filter:brightness(.92)}
.btn.sec{background:transparent;color:var(--tint);padding:10px}
.btn.go{background:var(--grn);color:#06301A}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px;line-height:1.38}
.n-grn{background:var(--tintS);color:var(--tint)}
.n-amb{background:var(--ambS);color:var(--amb)}
.foot{font-size:12px;color:var(--sec);line-height:1.4;margin:10px 4px 0}

.tabbar{flex:none;background:var(--w);border-top:1px solid var(--sep);display:flex;padding:10px 0 4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ter);font-size:10px;font-weight:500}
.tab.on{color:var(--tint)}
.tab:active{opacity:.6}

.hero{border-radius:14px;padding:18px}
.hero.red{background:var(--redS)}
.hero.grn{background:var(--tintS);border:1.5px solid var(--tint)}
.hero h2{margin:0;font-size:20px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:#fff;color:var(--deep);font-size:12px;font-weight:600;padding:4px 10px;border-radius:9px}

.ringwrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 4px;cursor:pointer}
.ring{position:relative;width:200px;height:200px}
.ring svg{transform:rotate(-90deg)}
.ring .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pcn{font-size:44px;font-weight:700;letter-spacing:-1.5px}
.ring .pcs{font-size:13px;color:var(--sec);margin-top:2px}
.prog{height:6px;border-radius:3px;background:var(--sep);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--tint);border-radius:3px;transition:width .6s ease}

.vf{border-radius:28px;background:#17231F;position:relative;height:300px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.dcard{display:flex;gap:12px;align-items:center;background:#17231F;border-radius:14px;padding:14px;margin-top:18px}
.illus{background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:center}

.hint{color:#8FA39A;font-size:12.5px;text-align:center;max-width:393px;line-height:1.5}
.hint b{color:#CFE0D7;font-weight:600}
.reset{background:#223029;color:#CFE0D7;border:0;font:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer}
.reset:active{opacity:.7}

@media (max-width:460px){
  body{padding:0;align-items:stretch}
  .stage{gap:0;width:100%}
  .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .viewport{border-radius:0}
  .island{top:6px}
  .hint,.reset{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="viewport" id="vp"></div></div>
  <div class="hint">Prototipe interaktif — semua tombol bisa ditekan. Mulai dari <b>Sign in</b>.</div>
  <button class="reset" onclick="reset()">Mulai ulang</button>
</div>
<script>
const ICONS = {
  sb: `<svg width="78" height="13" viewBox="0 0 78 13" fill="none"><rect y="8" width="3" height="5" rx="1" fill="currentColor"/><rect x="5" y="6" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="3.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="1" width="3" height="12" rx="1" fill="currentColor"/><path d="M25.5 4.2c2.6-2.2 6.4-2.2 9 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M27.8 7.1c1.4-1.2 3.4-1.2 4.8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="30.2" cy="10.4" r="1.6" fill="currentColor"/><rect x="44.5" y="1.5" width="23" height="10" rx="3" stroke="currentColor" opacity=".4"/><rect x="46" y="3" width="18" height="7" rx="1.8" fill="currentColor"/><path d="M69.5 4.8v3.4c1.1-.3 1.7-.9 1.7-1.7s-.6-1.4-1.7-1.7z" fill="currentColor" opacity=".4"/></svg>`,
  chev: `<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.2 2.2L8 6l-3.8 3.8" stroke="#A1A1A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  back: `<svg width="11" height="18" viewBox="0 0 12 20" fill="none"><path d="M9.5 2.5L2 10l7.5 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  ok: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="11" fill="#15724A"/><path d="M6 11.4l3.1 3.1 6.9-6.9" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  act: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="#15724A" stroke-width="2"/><circle cx="11" cy="11" r="4.6" fill="#15724A"><animate attributeName="r" values="3.4;5.2;3.4" dur="1.4s" repeatCount="indefinite"/></circle></svg>`,
  pen: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="#D3D3D8" stroke-width="2"/></svg>`,
  xred: `<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="13" fill="#FF3B30"/><path d="M8.6 8.6l8.8 8.8M17.4 8.6l-8.8 8.8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  warn: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="flex:none"><path d="M10 2l8 15H2L10 2z" fill="#D99B20"/><path d="M10 8v4.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1" fill="#fff"/></svg>`,
  clock: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="flex:none"><circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M9 5.2v4.4l2.8 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  spin: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#E5E5EA" stroke-width="3"/><path d="M12 2a10 10 0 0 1 10 10" stroke="#15724A" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></path></svg>`,
  tTests: c=>`<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><rect x="4" y="3" width="18" height="20" rx="3.5" stroke="${c}" stroke-width="2"/><path d="M9 9h8M9 13h8M9 17h5" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`,
  tPat: c=>`<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="4.2" stroke="${c}" stroke-width="2"/><path d="M5 22c1.6-4.2 4.6-6.3 8-6.3s6.4 2.1 8 6.3" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`,
  tSet: c=>`<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="3.4" stroke="${c}" stroke-width="2"/><path d="M13 3.5v2.6M13 19.9v2.6M22.5 13h-2.6M6.1 13H3.5M19.7 6.3l-1.8 1.8M8.1 17.9l-1.8 1.8M19.7 19.7l-1.8-1.8M8.1 8.1L6.3 6.3" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`,
};
const sb = () => `<div class="statusbar"><div class="sb-time">9:41</div><div class="island"></div><div class="sb-ic">${ICONS.sb}</div></div>`;
const hi = () => `<div class="homeind"><i></i></div>`;
const nav = (l,t,r,lg,rg,rdir) => `<div class="nav">
  <div class="nav-l" ${lg?`data-go="${lg}" data-dir="back"`:'data-tap'}>${l?ICONS.back+'<span>'+l+'</span>':''}</div>
  <div class="nav-t">${t}</div>
  <div class="nav-r" ${rg?`data-go="${rg}"${rdir?` data-dir="${rdir}"`:''}`:'data-tap'}>${r||''}</div></div>`;
const tabs = (on) => `<div class="tabbar">
  ${[['Tests','tTests','s02'],['Patients','tPat','s11'],['Settings','tSet','s12']].map(([n,i,g])=>
    `<div class="tab ${on===n?'on':''}" data-go="${g}" data-dir="fade">${ICONS[i](on===n?'#15724A':'#A1A1A6')}<span>${n}</span></div>`).join('')}
</div>`;
const row = (a,b,go,dir) => `<div class="row" ${go?`data-go="${go}"${dir?` data-dir="${dir}"`:''}`:'data-tap'}><div class="grow rl">${a}</div><div class="rv">${b||''}</div>${ICONS.chev}</div>`;
const ringSvg = (pct,col,id) => {
  const r=86,c=2*Math.PI*r;
  return `<svg width="200" height="200"><circle cx="100" cy="100" r="86" stroke="#E5E5EA" stroke-width="14" fill="none"/>
  <circle id="${id||''}" cx="100" cy="100" r="86" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" style="transition:stroke-dashoffset 1.1s ease"/></svg>`;
};

const S = {};

S.s01 = `${sb()}<div class="body" style="padding:40px 24px 16px">
  <svg width="76" height="76" viewBox="0 0 76 76" fill="none"><rect width="76" height="76" rx="18" fill="#15724A"/><path d="M26 20c0 11 24 11 24 22s-24 11-24 22" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M50 20c0 11-24 11-24 22s24 11 24 22" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M30 29h16M30 47h16" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/></svg>
  <div class="h1" style="margin:20px 0 6px">TB-SmartRx</div>
  <div style="font-size:15px;color:var(--sec);line-height:1.45;margin-bottom:28px">Point-of-care drug-resistance testing for <i>Mycobacterium tuberculosis</i></div>
  <div class="card">
    <div class="row" data-tap><div class="grow rv">Clinician ID</div><div class="rl">dr.jonathan</div></div>
    <div class="sep"></div>
    <div class="row" data-tap><div class="grow rv">Password</div><div class="rl">••••••••••</div></div>
  </div>
  <button class="btn" data-go="s02">Sign in</button>
  <button class="btn sec" data-go="s02" data-dir="fade">Use Face ID</button>
  <div class="foot" style="text-align:center;margin-top:26px">Research prototype. Results are genotypic and must be confirmed clinically.</div>
</div>${hi()}`;

S.s02 = `${sb()}<div class="body">
  <div class="h1">Tests</div>
  <div class="row" data-go="s03" style="background:var(--tint);border-radius:14px;padding:16px;gap:12px">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" style="flex:none"><circle cx="13" cy="13" r="13" fill="#fff" fill-opacity=".18"/><path d="M13 7v12M7 13h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    <div class="grow"><div style="color:#fff;font-size:17px;font-weight:600">Start new test</div><div style="color:#CFE4DA;font-size:12px;margin-top:2px">Insert a cartridge to begin</div></div>
  </div>
  <div class="sect">In progress</div>
  <div class="card"><div style="padding:14px 16px;cursor:pointer" data-go="s06">
    <div style="display:flex;align-items:center;gap:8px"><div class="grow" style="font-size:17px;font-weight:600">SPU-0418</div><span class="pill p-grn">Sequencing</span></div>
    <div class="prog"><i style="width:38%"></i></div>
    <div style="display:flex;font-size:13px;color:var(--sec)"><div class="grow">Stage 4 of 5</div><div>~1 h 20 m left</div></div>
  </div></div>
  <div class="sect">Completed</div>
  <div class="card">
    ${[['SPU-0412','Today, 08:14','MDR-TB','p-red'],['SPU-0407','Yesterday','No resistance','p-grn'],['SPU-0399','19 Nov','Pre-XDR','p-amb']].map((d,i)=>
    `<div class="row" data-go="s08"><div class="grow"><div class="rl">${d[0]}</div><div class="sub">${d[1]}</div></div><span class="pill ${d[3]}">${d[2]}</span>${ICONS.chev}</div>${i<2?'<div class="sep"></div>':''}`).join('')}
  </div>
</div>${tabs('Tests')}${hi()}`;

S.s03 = `${sb()}${nav('Cancel','New Test','Next','s02','s04')}<div class="body">
  <div class="sect">Patient</div>
  <div class="card">${[['Patient ID','SPU-0418'],['Age','34'],['Sex','Female'],['Site','RSUP Hasan Sadikin']].map((f,i)=>row(f[0],f[1])+(i<3?'<div class="sep"></div>':'')).join('')}</div>
  <div class="sect">Sample</div>
  <div class="card">${[['Specimen','Sputum'],['Volume','2.0 mL'],['Collected','22 Nov, 07:50']].map((f,i)=>row(f[0],f[1])+(i<2?'<div class="sep"></div>':'')).join('')}</div>
  <div class="note n-amb" data-tap>${ICONS.warn}<div>Handle sputum at biosafety level 2. Use the sealed cartridge inlet only.</div></div>
  <button class="btn" data-go="s04">Continue to cartridge</button>
</div>${hi()}`;

S.s04 = `${sb()}<div class="body" style="padding-top:4px">
  <div style="display:flex;align-items:center;gap:8px;color:#fff;font-size:17px;font-weight:600;padding:6px 0;cursor:pointer" data-go="s03" data-dir="back">${ICONS.back}<span>Scan cartridge</span></div>
  <div class="vf" style="margin-top:22px">
    <svg width="246" height="246" viewBox="0 0 246 246" fill="none" style="position:absolute;inset:0;margin:auto"><path d="M26 66V40a14 14 0 0 1 14-14h26" stroke="#34C759" stroke-width="4.5" stroke-linecap="round"/><path d="M180 26h26a14 14 0 0 1 14 14v26" stroke="#34C759" stroke-width="4.5" stroke-linecap="round"/><path d="M220 180v26a14 14 0 0 1-14 14h-26" stroke="#34C759" stroke-width="4.5" stroke-linecap="round"/><path d="M66 220H40a14 14 0 0 1-14-14v-26" stroke="#34C759" stroke-width="4.5" stroke-linecap="round"/></svg>
    <svg width="214" height="112" viewBox="0 0 230 120" fill="none"><rect x="2" y="26" width="226" height="70" rx="12" fill="#E4E7CE" stroke="#8F8B5E" stroke-width="2"/><rect x="2" y="86" width="226" height="10" rx="5" fill="#246B45"/><circle cx="26" cy="61" r="7" fill="#F0D98A" stroke="#14432B" stroke-width="2"/><path d="M38 61h28M92 61h22M140 61h22M186 61h30" stroke="#8F8B5E" stroke-width="5" stroke-linecap="round"/><rect x="66" y="47" width="26" height="28" rx="4" fill="#fff" stroke="#14432B" stroke-width="1.6"/><rect x="114" y="47" width="26" height="28" rx="4" fill="#fff" stroke="#14432B" stroke-width="1.6"/><rect x="162" y="47" width="24" height="28" rx="4" fill="#fff" stroke="#14432B" stroke-width="1.6"/><rect x="170" y="6" width="44" height="44" rx="6" fill="#fff"/><rect x="176" y="12" width="10" height="10" fill="#0C1512"/><rect x="198" y="12" width="10" height="10" fill="#0C1512"/><rect x="176" y="34" width="10" height="10" fill="#0C1512"/><rect x="192" y="28" width="6" height="6" fill="#0C1512"/><rect x="202" y="36" width="6" height="6" fill="#0C1512"/></svg>
  </div>
  <div style="text-align:center;color:#C9D2CD;font-size:15px;margin-top:20px">Hold the QR code on the cartridge inside the frame</div>
  <div class="dcard" data-go="s05">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex:none"><circle cx="12" cy="12" r="12" fill="#34C759"/><path d="M6.5 12.4l3.4 3.4 7.6-7.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="grow"><div style="color:#fff;font-size:15px;font-weight:600">Cartridge recognised</div><div style="color:#9FB0A8;font-size:12px;margin-top:2px">Lot C-2451 · Expires 03/2027 · Unused</div></div>
  </div>
  <button class="btn go" data-go="s05" style="margin-top:20px">Use this cartridge</button>
</div>${hi()}`;

const ORDER = Object.keys(S);
const vp = document.getElementById('vp');
ORDER.forEach(id=>{
  const d = document.createElement('div');
  d.className = 'screen' + (id==='s04'?' dark':'');
  d.id = id; d.innerHTML = S[id];
  vp.appendChild(d);
});
let cur = null;
function base(id){ return 'screen' + (id === 's04' ? ' dark' : ''); }
function go(id, dir){
  if(!S[id]) return;
  if(id === cur){ pulse(); return; }
  const next = document.getElementById(id);
  const prev = cur ? document.getElementById(cur) : null;
  // every screen not taking part in this transition returns to the hidden default
  ORDER.forEach(k=>{ if(k !== id && k !== cur){ const e = document.getElementById(k); e.className = base(k); e.style.transition = ''; } });
  const b = next.querySelector('.body'); if(b) b.scrollTop = 0;
  const startCls = dir === 'back' ? 'behind' : (dir === 'fade' ? 'fadein' : 'ahead');
  const exitCls  = dir === 'back' ? 'ahead'  : (dir === 'fade' ? 'fadeout' : 'behind');
  next.style.transition = '';
  next.className = base(id) + ' nofx ' + startCls;
  void next.offsetWidth;
  next.classList.remove('nofx');
  requestAnimationFrame(()=>{
    next.className = base(id) + ' active';
    if(prev){ prev.style.transition = ''; prev.className = base(cur) + ' ' + exitCls; }
  });
  cur = id;
  if(id === 's06') setTimeout(()=>{ const c = document.getElementById('r6'); if(c) c.style.strokeDashoffset = 2*Math.PI*86*0.38; }, 200);
}
function pulse(){ const el = document.getElementById(cur); if(!el) return; el.animate([{opacity:1},{opacity:.82},{opacity:1}],{duration:160}); }
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-go]');
  if(t){ go(t.getAttribute('data-go'), t.getAttribute('data-dir')); return; }
  const p = e.target.closest('[data-tap]');
  if(p){ p.animate([{transform:'scale(1)'},{transform:'scale(.985)'},{transform:'scale(1)'}],{duration:150}); }
});
function reset(){ ORDER.forEach(k=>{ const e = document.getElementById(k); e.className = base(k); e.style.transition=''; }); const c = document.getElementById('r6'); if(c) c.style.strokeDashoffset = 2*Math.PI*86; cur = null; go('s01','fade'); }
reset();
</script>
